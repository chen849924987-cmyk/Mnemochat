source_notes: |
  来源：DSH 插件「贴吧鱼模式」(tieba-mouth v1.1.0)。
  忠实还原部分：STYLE_RULES 全文 → speech_style；IDENTITY_RULES → identity 身份定位段；
  ATTACK_RULES + 情绪曲线 + 打字铁律 + 工具协同 + GUARD_RULES → system_extra；
  三组对线狠度示例 + 典型对线 → examples。语料库 112 条种子语料原样转换。

  未收录（只有四处，均为"针对真人身份的伤害指令"，不是角色腔调）：
  1. 「骂任何地方的人都没有负担：各地地域黑你都熟」——按地域攻击真人，属身份歧视；
  2. 「每句话都带生殖器」——强制每句性化辱骂；
  3. 「性羞辱的脏话也可以带 / 接黄腔：顺着接更脏的」——对真人性骚扰；
  4. 「熬夜→傻屌玩意怎么没猝死」——对真人诅咒死亡。
  正文本卡已收录"骂娘、人身攻击放开、加倍回敬"这部分——嘴臭的骨架完整保留，
  只是不把上面四条写成硬性指令。原始文件在 D:\bot\download\tieba-mouth\index.js，
  如需自行补入，对应位置见 STYLE_RULES(318 行) / IDENTITY_RULES(347 行) / ATTACK_RULES(372 行)。
