# ============================================================
# 群聊记忆机器人配置
# 复制为 config.yaml 后修改；密钥放 .env，此处用 ${环境变量名} 引用
# ============================================================

# 角色卡文件（personas/ 目录下）
persona_file: personas/default.yaml

# SQLite 数据库路径
database: data/memory.db

# ---------- 聊天模型（回复用） ----------
llm:
  base_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY}
  model: deepseek-chat
  temperature: 0.8
  max_tokens: 1024

# ---------- 提取模型（记忆提取/巩固用，可用便宜模型） ----------
extractor:
  base_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY}
  model: deepseek-chat
  temperature: 0.2
  max_tokens: 2048

# ---------- 嵌入（provider: api | local，切换后运行 --reembed 补齐旧向量） ----------
embedding:
  provider: api
  api:
    base_url: https://api.siliconflow.cn/v1
    api_key: ${SILICONFLOW_API_KEY}
    model: BAAI/bge-m3
    dim: 1024
    batch_size: 32
  local:
    # 需先安装: pip install -r requirements-local-embed.txt
    model_name: BAAI/bge-small-zh-v1.5
    dim: 512
    device: cpu

# ---------- 记忆写入 ----------
ingest:
  window_size: 8              # 每积累 N 条消息触发一次 LLM 提取
  min_interval_seconds: 20    # 两次提取之间的最小间隔
  dedup_threshold: 0.92       # 与既有记忆语义相似度超过该值 → 视为复现，强化旧记忆而非新建
  noise_importance_below: 3   # 重要性低于该值且无实体、非偏好 → 丢弃

# ---------- 巩固（"睡眠"） ----------
consolidation:
  interval_minutes: 30        # 自动检查周期
  min_age_hours: 24           # staging 至少存活该时长才可能晋升
  min_importance: 5           # 重要性达标可直接晋升；否则需要被复现过(recurrence_count>=1)
  cluster_similarity: 0.80    # 睡眠巩固：情节记忆聚类阈值
  min_cluster_size: 2         # 至少几条聚成一类才抽象为语义记忆
  supersede_check_topk: 3     # 矛盾检测时对比同主体最相似的 K 条旧记忆

# ---------- 检索 ----------
recall:
  top_k: 12                   # 注入上下文的记忆条数
  query_recent_messages: 5    # 用最近几条消息构造查询
  bm25_candidates: 50
  vector_candidates: 50
  entity_candidates: 20
  staging_min_age_hours: 6    # staging 记忆至少存活该时长才参与召回（更近的还在对话窗口里）
  weights:                    # salience 各因子权重
    similarity: 0.35
    bm25: 0.25
    retention: 0.20
    access: 0.10
    importance_emotion: 0.10

# ---------- 衰减（艾宾浩斯） ----------
decay:
  initial_base_days: 2.0      # 初始强度 S = base + importance
  reinforce_factor: 1.25      # 每次被召回 S 乘以该系数
  strength_cap_days: 365.0    # S 上限：记忆只会沉底，永不删除

# ---------- 群聊行为 ----------
behavior:
  reply_on_mention: true      # @机器人 或 提到名字 时必回
  names: []                   # 额外唤醒词（默认取角色卡名字），如 ["小满", "满满"]
  reply_on_question: false    # 问句是否必回（默认交给兴趣评分软判断）
  reply_probability: 0.15     # 概率插话（仅 interest_enabled: false 时生效）
  # 兴趣度评分：@/叫名字必回之外，按分数决定接不接话（纯本地计算，毫秒级）
  # 分数 = 话题基础 + 问句 + 角色兴趣词命中 + 记忆相关 + 情绪抖动 - 冷却惩罚
  interest_enabled: true
  interest_threshold: 45      # 达到才回（调低=更活跃，调高=更高冷）
  interest_cooldown_seconds: 180   # 刚回复过则兴致下降（防刷屏）
  interest_cooldown_penalty: 40
  interest_question_bonus: 20
  interest_memory_bonus: 25   # 消息提到机器人记得的人/事时加分
  interest_jitter: 15         # 情绪抖动上限：同样的消息时接时不接，避免机械感
  interest_min_length: 6      # 过短消息（哈哈/6）不构成话题

# ---------- 对话窗口 ----------
window:
  recent_turns: 20            # 组 prompt 时携带的最近消息条数

# ---------- QQ 接入（OneBot v11，可选） ----------
# 需先部署 NapCat / LLOneBot / Lagrange 并开启"正向 WebSocket 服务器"；
# 之后 python main.py --onebot 启动真实 QQ 群聊模式
onebot:
  ws_url: ws://127.0.0.1:3001
  access_token: ""            # 与 OneBot 实现侧设置的 token 一致，未设置则留空
  at_sender_on_reply: true    # 回复时是否 @ 发送者
  max_concurrent_replies: 4   # 并发回复上限（防 LLM 突发风暴）

# ---------- Telegram 接入（可选） ----------
# @BotFather 创建机器人拿 token；python main.py --telegram 启动（长轮询，无需公网）
telegram:
  bot_token: ${TELEGRAM_BOT_TOKEN}
  poll_timeout: 30
  reply_to_message: false

# ---------- 好友私聊（private:<QQ号> 虚拟群，记忆与群聊完全分开） ----------
private_chat:
  enabled: true
  always_reply: true       # 私聊每条必回；关掉则私聊也走兴趣评分
  secrecy_level: 2         # 守口如瓶参数：2=守口如瓶 1=偶尔说漏嘴 0=口无遮拦（旧字段 tight_lipped 仍兼容）

# ---------- 社交与串门（多角色卡互访） ----------
# 客卡定期到主卡所在的模拟群串门；GUI「设置 · 社交与串门」可视化维护
social:
  enabled: true
  host_replies: true       # 客人发言后主卡接话
  prefix_guest_name: true  # QQ 顶号模式：客人发言前缀【名字】
  visits: []               # 例：- {persona_file: personas/dafeiyu.yaml, database: data/memory_dafeiyu.db, every_hours: 8}

# ---------- 人格漂移检测 ----------
# 每次巩固后抽样评审机器人近期发言与角色卡的一致性；
# 判定漂移时注入一段"角色校准提醒"到后续回复的 system prompt，直到恢复
drift:
  enabled: true
  min_samples: 4
  sample_size: 12
  adherence_threshold: 6.0

# ---------- 表情包（旁观收集 → 学习分类 → 聊天时按分类发图） ----------
sticker:
  enabled: true
  collect_max_kb: 800          # 超过该大小的图视为照片，不入表情库
  retain_days: 90              # 遗忘：群里 N 天没出现的梗删除文件+记录（0=永不清理）
  send_cooldown_seconds: 300   # 发图冷却，防刷屏
  tag_batch: 8
  vision:
    # 视觉打标两种接法（标签判定始终由提取模型完成，这里只决定"谁来看图"）：
    # a) use_chat: true —— 聊天模型本身是多模态（如 DeepSeek 4.1 Flash）→ 直接用它看图，
    #    下面三项忽略；模型实际不支持图片时自动退回纯语境学习，功能不中断
    # b) use_chat: false + model 填独立 VL 模型（密钥用 SILICONFLOW_API_KEY）
    # use_chat: false 且 model 留空 = 纯语境学习（零额外成本）
    use_chat: false
    base_url: https://api.siliconflow.cn/v1
    api_key: ${SILICONFLOW_API_KEY}
    model: ""                  # 例：Qwen/Qwen2.5-VL-32B-Instruct

# 模拟器使用的群 ID
sim_group_id: "sim-main"
